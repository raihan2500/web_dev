<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>
    <form action="">
        <h1>Payment form</h1>
        <h2>Contact Information</h2>
        <p>Name:  <input type="text" name="name" required> </p>
        <fieldset>
            <legend>Gender</legend>
            <p>
                Male <input type="radio" name="gender">
                Female <input type="radio" name="gender">
            </p>
        </fieldset>
        <p>Address: <textarea name="address" id="address" rows="8" cols="100"></textarea> </p>
        <p>Email: <input type="email" name="email" id="email"></p>
        <p>Pincode: <input type="number" name="pincode" id="pincode"></p>
        

        <h2>Payment Information</h2>
        <p>Card type: 
            <select name="card" id="card">
                <option value="">--Select a card type</option>
                <option value="visa">visa</option>
                <option value="mastercard">mastercard</option>
                <option value="google_pay">google pay</option>
            </select>
        </p>
        <p>Card number: <input type="number" name="card_number" id="card_number"></p>
        <p>
            Exp: <input type="date" name="exp_date" id="exp_date" >
        </p>
        <p>
            CVV <input type="password" name="cvv" id="cvv">
        </p>
        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
